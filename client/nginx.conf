server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite asset filenames are content-hashed, so cache them hard
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Proxy the API to the benchmark server container.
    # proxy_buffering off is required: the load-test stream endpoint sends
    # live progress events and would otherwise be buffered until completion.
    location /api/ {
        proxy_pass https://api-load-test-backend-kukrka-7ce7f5-144-79-249-74.sslip.io;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
